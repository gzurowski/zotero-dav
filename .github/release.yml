# Configures the notes generated by "Generate release notes" / --generate-notes.
# Categories are matched in order and a PR lands in the first one that matches,
# so the "*" catch-all must exclude anything meant for a later category.
changelog:
  categories:
    - title: Features
      labels: ["enhancement"]

    - title: Fixes
      labels: ["bug"]

    - title: Documentation
      labels: ["documentation"]

    - title: Changes
      labels: ["*"] # unlabelled PRs
      exclude:
        labels: ["dependencies"]

    - title: Dependencies
      labels: ["dependencies"]
